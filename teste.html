<!DOCTYPE html>
<html lang="pt-BR">
<head>
<!--
============================================================================
 CHAT EM TEMPO REAL — HTML + Supabase (Realtime + Postgres + Presence)
============================================================================
 COMO CONFIGURAR (leia antes de publicar):

 1) Crie um projeto gratuito em https://supabase.com

 2) Abra o "SQL Editor" do projeto e rode o script abaixo:

    create table if not exists public.messages (
      id uuid primary key default gen_random_uuid(),
      username text not null,
      content text not null,
      created_at timestamptz not null default now()
    );

    alter table public.messages enable row level security;

    create policy "Leitura publica de mensagens"
      on public.messages for select
      using (true);

    create policy "Insercao publica de mensagens"
      on public.messages for insert
      with check (true);

    -- habilita o Realtime nesta tabela
    alter publication supabase_realtime add table public.messages;

    (Este exemplo usa acesso público, sem login de verdade — ideal para
    testar rápido. Para produção, troque por autenticação real do
    Supabase Auth e regras de RLS por usuário.)

 3) Em "Project Settings" > "API", copie a "Project URL" e a
    "anon public key" e cole nas duas constantes logo no início da
    tag <script> no final deste arquivo (SUPABASE_URL e SUPABASE_ANON_KEY).

 4) Suba este arquivo (index.html) para um repositório no GitHub e ative
    o GitHub Pages em Settings > Pages > "Deploy from a branch".
    Pronto: o link do GitHub Pages já é o seu chat funcionando.
============================================================================
-->
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Varanda — chat em tempo real</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg: #0c1a1d;
    --surface: #12262a;
    --surface-2: #17303488;
    --border: #1f373b;
    --text: #e9f3f1;
    --text-dim: #8fa9a6;
    --accent: #2dd4bf;
    --accent-ink: #06201c;
    --accent-2: #f4a340;
    --bubble-other: #1c363b;
    --danger: #e07a5f;
    --radius: 16px;
  }

  *{ box-sizing:border-box; }

  html,body{
    height:100%;
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family:'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body{
    background-image:
      radial-gradient(circle at 15% 10%, #123033 0%, transparent 45%),
      radial-gradient(circle at 85% 90%, #14282a 0%, transparent 50%);
  }

  h1,h2,h3, .brand, .msg-username{
    font-family:'Space Grotesk', system-ui, sans-serif;
  }

  button{ font-family:inherit; }

  #app{ height:100vh; width:100vw; overflow:hidden; }

  /* ---------- TELA DE LOGIN ---------- */
  #login-screen{
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }

  .login-card{
    width:100%;
    max-width:380px;
    background: var(--surface);
    border:1px solid var(--border);
    border-radius: 20px;
    padding:36px 30px;
    box-shadow: 0 20px 60px rgba(0,0,0,.35);
  }

  .login-card .mark{
    width:52px; height:52px;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--accent), #14776c);
    display:flex; align-items:center; justify-content:center;
    font-size:22px; font-weight:700; color:var(--accent-ink);
    margin-bottom:18px;
  }

  .login-card h1{
    font-size:24px; margin:0 0 6px;
  }

  .login-card p{
    color:var(--text-dim);
    margin:0 0 24px;
    font-size:14px;
    line-height:1.5;
  }

  .field{
    display:flex; flex-direction:column; gap:8px;
    margin-bottom:18px;
  }

  .field label{
    font-size:12px;
    letter-spacing:.04em;
    text-transform:uppercase;
    color: var(--text-dim);
  }

  .field input{
    background: #0e1f22;
    border:1px solid var(--border);
    border-radius: 10px;
    padding:12px 14px;
    color: var(--text);
    font-size:15px;
    outline:none;
    transition:border-color .15s ease;
  }

  .field input:focus{ border-color: var(--accent); }

  .btn-primary{
    width:100%;
    background: var(--accent);
    color: var(--accent-ink);
    border:none;
    border-radius: 10px;
    padding:13px 16px;
    font-weight:600;
    font-size:15px;
    cursor:pointer;
    transition: transform .1s ease, opacity .15s ease;
  }

  .btn-primary:hover{ opacity:.92; }
  .btn-primary:active{ transform: scale(.98); }

  .login-error{
    color: var(--danger);
    font-size:13px;
    margin:-8px 0 14px;
    min-height:16px;
  }

  /* ---------- TELA DE CHAT ---------- */
  #chat-screen{
    height:100%;
    display:grid;
    grid-template-columns: 280px 1fr;
  }

  .sidebar{
    background: var(--surface);
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
    min-width:0;
  }

  .sidebar-header{
    padding:20px 18px 14px;
    display:flex;
    align-items:center;
    gap:10px;
    border-bottom:1px solid var(--border);
  }

  .sidebar-header .mark{
    width:34px; height:34px; border-radius:10px;
    background: linear-gradient(135deg, var(--accent), #14776c);
    display:flex; align-items:center; justify-content:center;
    font-weight:700; color:var(--accent-ink); font-size:15px;
    flex-shrink:0;
  }

  .brand{ font-size:16px; font-weight:600; }
  .brand-sub{ font-size:12px; color:var(--text-dim); }

  .sidebar-section-label{
    padding:16px 18px 6px;
    font-size:11px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color: var(--text-dim);
  }

  #online-list{
    list-style:none;
    margin:0; padding:0 8px;
    overflow-y:auto;
    flex:1;
  }

  #online-list li{
    display:flex;
    align-items:center;
    gap:10px;
    padding:9px 10px;
    border-radius:10px;
  }

  #online-list li:hover{ background: var(--surface-2); }

  .avatar{
    width:34px; height:34px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:600;
    color:#08221f;
    flex-shrink:0;
    position:relative;
  }

  .avatar.small{ width:28px; height:28px; font-size:11px; }

  .status-dot{
    width:9px; height:9px;
    border-radius:50%;
    background: var(--accent);
    border:2px solid var(--surface);
    position:absolute;
    right:-2px; bottom:-2px;
  }

  .online-name{
    font-size:14px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .sidebar-footer{
    padding:14px 18px;
    border-top:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
  }

  .me{
    display:flex; align-items:center; gap:10px; min-width:0;
  }

  .me-name{
    font-size:14px; font-weight:600;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }

  .icon-btn{
    background:none; border:1px solid var(--border);
    color: var(--text-dim);
    width:32px; height:32px;
    border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    flex-shrink:0;
  }

  .icon-btn:hover{ color: var(--text); border-color: var(--accent); }

  /* ---------- ÁREA PRINCIPAL ---------- */
  .chat-main{
    display:flex;
    flex-direction:column;
    min-width:0;
    height:100%;
  }

  .chat-header{
    padding:16px 22px;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    background: var(--surface);
  }

  .chat-header-left{ display:flex; align-items:center; gap:12px; }

  #menu-toggle{ display:none; }

  .room-title{ font-size:16px; font-weight:600; }
  .room-sub{ font-size:12px; color: var(--text-dim); display:flex; align-items:center; gap:6px; }

  .conn-dot{
    width:7px; height:7px; border-radius:50%;
    background: var(--text-dim);
  }
  .conn-dot.on{ background: var(--accent); box-shadow:0 0 0 3px rgba(45,212,191,.15); }
  .conn-dot.off{ background: var(--danger); }

  #messages{
    flex:1;
    overflow-y:auto;
    padding:22px 24px;
    display:flex;
    flex-direction:column;
    gap:2px;
  }

  .day-divider{
    align-self:center;
    background: var(--surface-2);
    color: var(--text-dim);
    font-size:11px;
    padding:5px 12px;
    border-radius:20px;
    margin:16px 0;
  }

  .msg-row{
    display:flex;
    gap:10px;
    max-width:70%;
    margin-bottom:10px;
    align-items:flex-end;
  }

  .msg-row.own{
    align-self:flex-end;
    flex-direction:row-reverse;
  }

  .msg-row .avatar{ margin-bottom:2px; }
  .msg-row.own .avatar{ visibility:hidden; width:0; }

  .bubble{
    background: var(--bubble-other);
    border-radius: var(--radius);
    border-bottom-left-radius:4px;
    padding:10px 14px 8px;
    position:relative;
  }

  .msg-row.own .bubble{
    background: linear-gradient(135deg, var(--accent), #14a294);
    color: var(--accent-ink);
    border-bottom-left-radius: var(--radius);
    border-bottom-right-radius:4px;
  }

  .msg-username{
    font-size:12.5px;
    font-weight:600;
    margin-bottom:2px;
    color: var(--accent-2);
  }

  .msg-row.own .msg-username{ display:none; }

  .msg-content{
    font-size:14.5px;
    line-height:1.45;
    white-space:pre-wrap;
    word-break:break-word;
  }

  .msg-time{
    font-size:10.5px;
    color: var(--text-dim);
    margin-top:4px;
    text-align:right;
  }

  .msg-row.own .msg-time{ color: rgba(6,32,28,.6); }

  #typing-indicator{
    min-height:26px;
    padding:0 24px 4px;
    font-size:12.5px;
    color: var(--text-dim);
    display:flex;
    align-items:center;
    gap:6px;
  }

  .typing-dots{ display:inline-flex; gap:3px; }
  .typing-dots span{
    width:5px; height:5px; border-radius:50%;
    background: var(--text-dim);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing-dots span:nth-child(2){ animation-delay:.15s; }
  .typing-dots span:nth-child(3){ animation-delay:.3s; }

  @keyframes bounce{
    0%, 60%, 100%{ transform: translateY(0); opacity:.5; }
    30%{ transform: translateY(-4px); opacity:1; }
  }

  .composer{
    display:flex;
    align-items:flex-end;
    gap:10px;
    padding:14px 22px;
    border-top:1px solid var(--border);
    background: var(--surface);
  }

  .composer textarea{
    flex:1;
    resize:none;
    background: #0e1f22;
    border:1px solid var(--border);
    border-radius:14px;
    color: var(--text);
    font-family:inherit;
    font-size:14.5px;
    padding:11px 14px;
    max-height:120px;
    outline:none;
  }

  .composer textarea:focus{ border-color: var(--accent); }

  .send-btn{
    background: var(--accent);
    color: var(--accent-ink);
    border:none;
    width:42px; height:42px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    transition: transform .1s ease, opacity .15s ease;
  }

  .send-btn:hover{ opacity:.9; }
  .send-btn:active{ transform: scale(.94); }
  .send-btn:disabled{ opacity:.4; cursor:not-allowed; }

  .empty-state{
    margin:auto;
    text-align:center;
    color: var(--text-dim);
    font-size:14px;
    max-width:260px;
  }

  #messages::-webkit-scrollbar, #online-list::-webkit-scrollbar{ width:8px; }
  #messages::-webkit-scrollbar-thumb, #online-list::-webkit-scrollbar-thumb{
    background: var(--border); border-radius:8px;
  }

  [hidden]{ display:none !important; }

  /* ---------- RESPONSIVO ---------- */
  @media (max-width: 760px){
    #chat-screen{ grid-template-columns: 1fr; }
    .sidebar{
      position:fixed;
      inset:0 auto 0 0;
      width:78%;
      max-width:300px;
      z-index:20;
      transform: translateX(-105%);
      transition: transform .2s ease;
      box-shadow: 20px 0 40px rgba(0,0,0,.4);
    }
    .sidebar.open{ transform: translateX(0); }
    #menu-toggle{ display:flex; }
    .msg-row{ max-width:86%; }
  }

  @media (prefers-reduced-motion: reduce){
    .typing-dots span{ animation:none; }
    .sidebar{ transition:none; }
  }
</style>
</head>
<body>

<div id="app">

  <!-- ===================== TELA DE LOGIN ===================== -->
  <section id="login-screen">
    <form class="login-card" id="login-form">
      <div class="mark">V</div>
      <h1>Entrar na Varanda</h1>
      <p>Escolha um nome para participar do chat em tempo real. Sem senha — é só um jeito de te identificar para os outros.</p>
      <div class="field">
        <label for="username-input">Seu nome</label>
        <input id="username-input" type="text" maxlength="24" autocomplete="off" placeholder="Ex: Marina" required />
      </div>
      <div class="login-error" id="login-error"></div>
      <button type="submit" class="btn-primary">Entrar no chat</button>
    </form>
  </section>

  <!-- ===================== TELA DE CHAT ===================== -->
  <section id="chat-screen" hidden>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="mark">V</div>
        <div>
          <div class="brand">Varanda</div>
          <div class="brand-sub">sala geral</div>
        </div>
      </div>

      <div class="sidebar-section-label">Online agora</div>
      <ul id="online-list"></ul>

      <div class="sidebar-footer">
        <div class="me">
          <div class="avatar small" id="me-avatar"></div>
          <div class="me-name" id="me-name"></div>
        </div>
        <button class="icon-btn" id="logout-btn" title="Sair">⏻</button>
      </div>
    </aside>

    <main class="chat-main">
      <header class="chat-header">
        <div class="chat-header-left">
          <button class="icon-btn" id="menu-toggle" title="Contatos online">☰</button>
          <div>
            <div class="room-title">Sala geral</div>
            <div class="room-sub"><span class="conn-dot" id="conn-dot"></span><span id="conn-text">conectando…</span></div>
          </div>
        </div>
      </header>

      <div id="messages">
        <div class="empty-state" id="empty-state">Nenhuma mensagem ainda.<br>Diga oi para começar a conversa 👋</div>
      </div>

      <div id="typing-indicator"></div>

      <form class="composer" id="message-form">
        <textarea id="message-input" rows="1" placeholder="Escreva uma mensagem…" autocomplete="off"></textarea>
        <button type="submit" class="send-btn" id="send-btn" title="Enviar">➤</button>
      </form>
    </main>

  </section>

</div>

<script>
(() => {
  // =====================================================================
  // 1) CONFIGURE AQUI as suas credenciais do Supabase (passo 3 do topo do arquivo)
  // =====================================================================
 const SUPABASE_URL = "https://wdrmhpdvzafypdxaxrjz.supabase.co";

const SUPABASE_ANON_KEY = "sb_publishable_gLKsdU93vG1CaDMPAeVqBQ_N0yNMgbf";

  const ROOM = "geral";
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // ------------------------------------------------------------------
  // Estado local
  // ------------------------------------------------------------------
  let me = null;           // { name }
  let channel = null;
  let typingTimeout = null;
  const typingUsers = new Map(); // username -> timeoutId

  // ------------------------------------------------------------------
  // Elementos
  // ------------------------------------------------------------------
  const loginScreen = document.getElementById("login-screen");
  const chatScreen = document.getElementById("chat-screen");
  const loginForm = document.getElementById("login-form");
  const usernameInput = document.getElementById("username-input");
  const loginError = document.getElementById("login-error");

  const messagesEl = document.getElementById("messages");
  const emptyState = document.getElementById("empty-state");
  const messageForm = document.getElementById("message-form");
  const messageInput = document.getElementById("message-input");
  const sendBtn = document.getElementById("send-btn");
  const onlineList = document.getElementById("online-list");
  const meAvatar = document.getElementById("me-avatar");
  const meName = document.getElementById("me-name");
  const logoutBtn = document.getElementById("logout-btn");
  const menuToggle = document.getElementById("menu-toggle");
  const sidebar = document.getElementById("sidebar");
  const connDot = document.getElementById("conn-dot");
  const connText = document.getElementById("conn-text");
  const typingIndicator = document.getElementById("typing-indicator");

  // ------------------------------------------------------------------
  // Utilidades
  // ------------------------------------------------------------------
  function hueFromName(name){
    let hash = 0;
    for (let i = 0; i < name.length; i++){
      hash = name.charCodeAt(i) + ((hash << 5) - hash);
    }
    return Math.abs(hash) % 360;
  }

  function avatarStyle(name){
    const hue = hueFromName(name || "?");
    return `background: hsl(${hue} 65% 55%);`;
  }

  function initials(name){
    return (name || "?").trim().slice(0, 2).toUpperCase();
  }

  function formatTime(iso){
    const d = new Date(iso);
    return d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
  }

  function formatDay(iso){
    const d = new Date(iso);
    return d.toLocaleDateString("pt-BR", { day: "2-digit", month: "long" });
  }

  function scrollToBottom(){
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function setConnStatus(status){
    // status: 'connecting' | 'online' | 'offline'
    connDot.className = "conn-dot" + (status === "online" ? " on" : status === "offline" ? " off" : "");
    connText.textContent = status === "online" ? "conectado" : status === "offline" ? "desconectado" : "conectando…";
  }

  // ------------------------------------------------------------------
  // Renderização de mensagens
  // ------------------------------------------------------------------
  let lastDayLabel = null;

  function renderMessage(msg){
    emptyState.hidden = true;

    const dayLabel = formatDay(msg.created_at);
    if (dayLabel !== lastDayLabel){
      const divider = document.createElement("div");
      divider.className = "day-divider";
      divider.textContent = dayLabel;
      messagesEl.appendChild(divider);
      lastDayLabel = dayLabel;
    }

    const isOwn = msg.username === me.name;

    const row = document.createElement("div");
    row.className = "msg-row" + (isOwn ? " own" : "");

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.setAttribute("style", avatarStyle(msg.username));
    avatar.textContent = initials(msg.username);

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    const uname = document.createElement("div");
    uname.className = "msg-username";
    uname.textContent = msg.username;

    const content = document.createElement("div");
    content.className = "msg-content";
    content.textContent = msg.content;

    const time = document.createElement("div");
    time.className = "msg-time";
    time.textContent = formatTime(msg.created_at);

    bubble.appendChild(uname);
    bubble.appendChild(content);
    bubble.appendChild(time);

    row.appendChild(avatar);
    row.appendChild(bubble);
    messagesEl.appendChild(row);

    scrollToBottom();
  }

  // ------------------------------------------------------------------
  // Presença (usuários online)
  // ------------------------------------------------------------------
  function renderOnlineList(state){
    onlineList.innerHTML = "";
    const names = new Set();
    Object.values(state).forEach(entries => {
      entries.forEach(entry => names.add(entry.username));
    });

    if (names.size === 0){
      const li = document.createElement("li");
      li.className = "online-name";
      li.style.color = "var(--text-dim)";
      li.textContent = "Ninguém por aqui ainda";
      onlineList.appendChild(li);
      return;
    }

    [...names].sort().forEach(name => {
      const li = document.createElement("li");

      const avatar = document.createElement("div");
      avatar.className = "avatar small";
      avatar.setAttribute("style", avatarStyle(name));
      avatar.textContent = initials(name);
      const dot = document.createElement("span");
      dot.className = "status-dot";
      avatar.appendChild(dot);

      const label = document.createElement("span");
      label.className = "online-name";
      label.textContent = name + (name === me.name ? " (você)" : "");

      li.appendChild(avatar);
      li.appendChild(label);
      onlineList.appendChild(li);
    });
  }

  // ------------------------------------------------------------------
  // Indicador de "digitando…"
  // ------------------------------------------------------------------
  function renderTypingIndicator(){
    const names = [...typingUsers.keys()];
    if (names.length === 0){
      typingIndicator.innerHTML = "";
      return;
    }
    const label = names.length === 1
      ? `${names[0]} está digitando`
      : `${names.slice(0, 2).join(", ")} estão digitando`;

    typingIndicator.innerHTML = `${label}<span class="typing-dots"><span></span><span></span><span></span></span>`;
  }

  function markTyping(username){
    if (username === me.name) return;
    if (typingUsers.has(username)){
      clearTimeout(typingUsers.get(username));
    }
    const timeoutId = setTimeout(() => {
      typingUsers.delete(username);
      renderTypingIndicator();
    }, 2500);
    typingUsers.set(username, timeoutId);
    renderTypingIndicator();
  }

  // ------------------------------------------------------------------
  // Carregar histórico + conectar realtime
  // ------------------------------------------------------------------
  async function loadHistory(){
    const { data, error } = await supabase
      .from("messages")
      .select("*")
      .order("created_at", { ascending: true })
      .limit(200);

    if (error){
      console.error("Erro ao carregar mensagens:", error);
      return;
    }
    data.forEach(renderMessage);
  }

  function connectRealtime(){
    channel = supabase.channel(`room:${ROOM}`, {
      config: { presence: { key: me.name } }
    });

    channel.on("postgres_changes",
      { event: "INSERT", schema: "public", table: "messages" },
      (payload) => {
        renderMessage(payload.new);
        typingUsers.delete(payload.new.username);
        renderTypingIndicator();
      }
    );

    channel.on("broadcast", { event: "typing" }, ({ payload }) => {
      markTyping(payload.username);
    });

    channel.on("presence", { event: "sync" }, () => {
      renderOnlineList(channel.presenceState());
    });

    channel.subscribe(async (status) => {
      if (status === "SUBSCRIBED"){
        setConnStatus("online");
        await channel.track({ username: me.name, online_at: new Date().toISOString() });
      } else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT"){
        setConnStatus("offline");
      } else if (status === "CLOSED"){
        setConnStatus("offline");
      }
    });
  }

  // ------------------------------------------------------------------
  // Envio de mensagens
  // ------------------------------------------------------------------
  async function sendMessage(text){
    const content = text.trim();
    if (!content) return;

    sendBtn.disabled = true;
    const { error } = await supabase.from("messages").insert({
      username: me.name,
      content
    });
    sendBtn.disabled = false;

    if (error){
      console.error("Erro ao enviar mensagem:", error);
      alert("Não foi possível enviar a mensagem. Verifique a configuração do Supabase.");
    }
  }

  messageForm.addEventListener("submit", (e) => {
    e.preventDefault();
    sendMessage(messageInput.value);
    messageInput.value = "";
    messageInput.style.height = "auto";
  });

  messageInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey){
      e.preventDefault();
      messageForm.requestSubmit();
    }
  });

  messageInput.addEventListener("input", () => {
    messageInput.style.height = "auto";
    messageInput.style.height = Math.min(messageInput.scrollHeight, 120) + "px";

    if (!channel) return;
    clearTimeout(typingTimeout);
    channel.send({
      type: "broadcast",
      event: "typing",
      payload: { username: me.name }
    });
  });

  // ------------------------------------------------------------------
  // Login / logout
  // ------------------------------------------------------------------
  loginForm.addEventListener("submit", (e) => {
    e.preventDefault();
    const name = usernameInput.value.trim();

    if (name.length < 2){
      loginError.textContent = "Digite um nome com pelo menos 2 letras.";
      return;
    }

    if (SUPABASE_URL === "SUA_URL_AQUI" || SUPABASE_ANON_KEY === "SUA_CHAVE_AQUI"){
      loginError.textContent = "Configure SUPABASE_URL e SUPABASE_ANON_KEY no código antes de usar.";
      return;
    }

    loginError.textContent = "";
    me = { name };
    localStorage.setItem("varanda_username", name);

    meName.textContent = name;
    meAvatar.setAttribute("style", avatarStyle(name));
    meAvatar.textContent = initials(name);

    loginScreen.hidden = true;
    chatScreen.hidden = false;

    setConnStatus("connecting");
    loadHistory().then(connectRealtime);
  });

  logoutBtn.addEventListener("click", async () => {
    if (channel) await supabase.removeChannel(channel);
    localStorage.removeItem("varanda_username");
    location.reload();
  });

  menuToggle.addEventListener("click", () => {
    sidebar.classList.toggle("open");
  });

  document.addEventListener("click", (e) => {
    if (sidebar.classList.contains("open") &&
        !sidebar.contains(e.target) &&
        e.target !== menuToggle){
      sidebar.classList.remove("open");
    }
  });

  // ------------------------------------------------------------------
  // Preenche o nome salvo, se houver
  // ------------------------------------------------------------------
  const savedName = localStorage.getItem("varanda_username");
  if (savedName) usernameInput.value = savedName;

})();
</script>
</body>
</html>
